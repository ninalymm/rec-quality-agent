name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 第一关：离线测试与覆盖率，不花钱、不依赖网络
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # 第二关：真实回归。跑 20 条任务，成功率比基线低 5 个百分点就失败
  regression:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt

      - name: 回归门禁（成功率低于基线 5% 则失败）
        if: env.DEEPSEEK_API_KEY != ''
        run: python -m eval.regression

      - name: 未配置 key，跳过回归
        if: env.DEEPSEEK_API_KEY == ''
        run: echo "::warning::未配置 DEEPSEEK_API_KEY，回归门禁已跳过（fork 场景正常）"
